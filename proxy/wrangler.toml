name = "besir-proxy"
main = "src/index.js"
compatibility_date = "2024-11-01"

# (구) Workers AI 바인딩 [ai]/binding="AI"는 2026-09-13 제거됨 — OpenAI gpt-5.6-luna로
# 확정되면서 폴백 백엔드가 필요 없어졌다(src/index.js의 proxyWorkersAI도 같이 삭제).
# 되살릴 일이 생기면 이 시점의 커밋에서 바인딩과 함수를 함께 되돌려야 한다.

# ⚠️ Smart Placement 비활성화(2026-09-09): 켜봤더니 오히려 Gemini가 차단하는 특정 지역으로
# 실행 위치가 고정돼(요청마다 랜덤이 아니라 계속 같은 곳) "User location is not supported"가
# 거의 매번 발생했다(8/8 실패). 기본(엣지별 랜덤 라우팅)이 그나마 확률적으로 통과 가능해 되돌림.

# 비밀값은 코드/깃에 넣지 않고 wrangler secret 으로 등록한다:
#   wrangler secret put KAKAO_REST_KEY
#   wrangler secret put ODSAY_KEY
#   wrangler secret put OPENAI_KEY      # 대화형 일정 등록(/ai/chat) 기본 백엔드 — 2026-09-12 도입
#   wrangler secret put ANTHROPIC_KEY   # Claude 대화형 일정 등록용(현재 미사용)
#   wrangler secret put APP_TOKEN
#
# (GEMINI_KEY는 2026-09-09 제거됨 — 위 주석 참고)
#
# 로컬 개발(`wrangler dev`)에서는 .dev.vars 파일에서 읽는다(아래 README 참고, gitignore됨).
